
name: DBSMPTrade
main: com.dbsmp.trade.DBSMPTrade
version: 1.0.0
author: DBSMP
description: Trading and selling system for Paper 1.8.8
softdepend:
  - Vault
  - DBSMPEconomy
commands:
  trade:
    description: Trade with another player
    usage: /trade <player|accept|cancel|money|gui>
  sell:
    description: Sell items to the server
    usage: /sell <hand|all|prices>
  shop:
    description: Open the DBSMP server shop
    usage: /shop
permissions:
  dbsmptrade.use:
    default: true
  dbsmptrade.admin:
    default: op
